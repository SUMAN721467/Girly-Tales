        return diff;

          return [...prev, { key, product, size, qty: 1 }];

                        const offset = getCatOffset(idx);
                        const isCenter = offset === 0;
                        const isPrev = offset === -1;
                        const isNext = offset === 1;
                        const isFarPrev = offset === -2;
                        const isFarNext = offset === 2;

                        let transformStyles = '';
                        let zIndex = 0;
                        let opacity = 0;
                        let pointerEvents = 'none';

                        if (isCenter) {
                          transformStyles = 'translate3d(0%, 0, 0) scale(1)';
                          zIndex = 30;
                          opacity = 1;
                          pointerEvents = 'auto';
                        } else if (isPrev) {
                          transformStyles = 'translate3d(-78%, 0, 0) scale(0.92)';
                          zIndex = 20;
                          opacity = 0.88;
                          pointerEvents = 'auto';
                        } else if (isNext) {
                          transformStyles = 'translate3d(78%, 0, 0) scale(0.92)';
                          zIndex = 20;
                          opacity = 0.88;
                          pointerEvents = 'auto';
                        } else if (isFarPrev) {
                          transformStyles = 'translate3d(-154%, 0, 0) scale(0.84)';
                          zIndex = 10;
                          opacity = 0.74;
                          pointerEvents = 'auto';
                        } else if (isFarNext) {
                          transformStyles = 'translate3d(154%, 0, 0) scale(0.84)';
                          zIndex = 10;
                          opacity = 0.74;
                          pointerEvents = 'auto';
                        } else {
                          transformStyles = `translate3d(${offset > 0 ? 220 : -220}%, 0, 0) scale(0.65)`;
                          zIndex = 5;
                          opacity = 0;
                          pointerEvents = 'none';
                        }

                              }
                            }}
                            className={`absolute w-[70vw] sm:w-[42vw] md:w-[32vw] lg:w-[26vw] xl:w-[24vw] max-w-[360px] aspect-[4/5] rounded-xl overflow-hidden cursor-pointer transition-all duration-700 ease-[cubic-bezier(0.25,1,0.5,1)] origin-center ${
                              isCenter ? 'shadow-2xl ring-1 ring-black/10' : 'shadow-xl'
                            }`}
                            style={{
                              transform: transformStyles,
                              zIndex,
                              opacity,
                              pointerEvents,
                            }}
                          >
                            <img
                              src={cat.image}
                              alt={cat.name}
                              className={`w-full h-full object-cover object-center transition-transform duration-1000 ease-out ${isCenter ? 'group-hover:scale-105' : 'filter brightness-95'}`}
                            />
                            <div className="absolute inset-0 bg-gradient-to-t from-black/85 via-black/25 to-transparent pointer-events-none"></div>

                            <div className={`absolute inset-x-3 sm:inset-x-5 bottom-4 sm:bottom-7 flex flex-col items-center text-center z-20 transition-all duration-500 ${isCenter ? 'opacity-100 translate-y-0' : 'opacity-85 translate-y-1'}`}>
                              <h3 className="font-sans font-black text-sm sm:text-base md:text-xl text-white uppercase tracking-[0.16em] pb-1 border-b-[1.5px] border-white drop-shadow-md">
                                {cat.name}
                              </h3>
                              <p className="text-[10px] sm:text-xs md:text-sm text-[#fffeea] font-medium tracking-wide mt-1.5 drop-shadow line-clamp-1 max-w-[92%]">
                                {cat.tagline}
                              </p>

                              {isCenter && (
                                <button
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    navigate('shop', cat.category);
                                  }}
                                  className="mt-2.5 sm:mt-3.5 bg-[#FBB6CE] hover:bg-[#F89CBA] text-[#1A1821] px-4 sm:px-6 py-1.5 sm:py-2 rounded-lg text-[11px] sm:text-xs font-black tracking-widest uppercase transition-all duration-200 shadow-md hover:scale-105 flex items-center gap-1.5 cursor-pointer"
                                >
                                  <span>{cat.ctaText || 'SHOP NOW'}</span>
                                  <span>→</span>
                                </button>
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>

                    {/* Pagination Indicator Dots */}
                    <div className="flex items-center justify-center gap-1.5 mt-2.5 sm:mt-3.5">
                      {CATEGORIES.map((_, dotIdx) => {
                        const isActive = dotIdx === catActiveIdx;
                        return (
                          <button
                            key={dotIdx}
                            onClick={() => setCatActiveIdx(dotIdx)}
                            className={`transition-all duration-300 rounded-full cursor-pointer ${
                              isActive
                                ? 'w-6 h-1.5 bg-[#967BB6]'
                                : 'w-1.5 h-1.5 bg-[#D1CAD9] hover:bg-[#967BB6]/60'
                            }`}
                            aria-label={`Go to slide ${dotIdx + 1}`}
                          />
                        );
                      })}
                    </div>
                  </div>
                </div>

                {/* 3. TRENDING THIS SEASON */}
                <div className="max-w-7xl mx-auto px-4 sm:px-6 space-y-6 mt-8 sm:mt-12">
                  <div className="flex items-center justify-between gap-2">
                    <h2 className="font-sans font-black text-lg sm:text-2xl md:text-3xl uppercase tracking-tight">TRENDING THIS SEASON</h2>
                    <button onClick={() => navigate('shop')} className="bg-[#FBB6CE] hover:bg-[#F89CBA] text-[#1A1821] px-3.5 sm:px-5 py-2 text-xs font-black uppercase tracking-wider rounded-lg shrink-0">
                      SHOP ALL TRENDING
                    </button>
                  </div>

                  <div className="grid grid-cols-2 md:grid-cols-4 gap-3.5 sm:gap-6">
                    {PRODUCTS.slice(0, 4).map(p => (
                      <div key={p.id} onClick={() => { setSelectedProduct(p); setPage('product'); }} className="group cursor-pointer flex flex-col justify-between">
                        <div className="aspect-[3/4] sm:aspect-[4/5] bg-white border border-[#EAE6DB] rounded-lg relative overflow-hidden mb-2">
                          <img src={p.images[0]} className="w-full h-full object-cover group-hover:scale-105 transition-all duration-300" />
                          {p.isNewArrival && <span className="absolute top-2 left-2 bg-[#967BB6] text-white text-[9px] font-bold px-2 py-0.5 uppercase rounded">New Arrival</span>}
                          {p.isBestSeller && !p.isNewArrival && <span className="absolute top-2 left-2 bg-[#E56B88] text-white text-[9px] font-bold px-2 py-0.5 uppercase rounded">Back in Stock</span>}
                          <span className="absolute bottom-2 left-2 bg-white/90 text-[9px] font-bold px-2 py-0.5 border rounded">
                            {p.category === 'jewellery' ? '18K Gold ✨' : '100% Cotton 🌿'}
                          </span>
                        </div>
                        <div>
                          <h4 className="font-sans font-bold text-xs sm:text-sm truncate group-hover:text-[#967BB6]">{p.name}</h4>
                          <p className="font-black text-xs sm:text-sm">Rs. {p.price}.00</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* 4. INFLUENCER-APPROVED COMFORT */}
                <div className="max-w-7xl mx-auto px-4 sm:px-6 space-y-6">
                  <div className="text-center space-y-1">
                    <h2 className="font-sans font-black text-xl sm:text-3xl uppercase tracking-tight">Influencer-Approved Comfort</h2>
                    <p className="text-xs text-brand-muted">Discover how influencers style our nightwear &amp; jewellery.</p>
                  </div>

                  <div className="grid grid-cols-2 lg:grid-cols-4 gap-3.5 sm:gap-5">
                    {INFLUENCER_ITEMS.map((inf, idx) => (
                      <div key={idx} className="bg-white border border-[#EAE6DB] rounded-xl overflow-hidden flex flex-col justify-between shadow-xs">
                        <div className="relative aspect-[9/14] rounded-t-xl overflow-hidden bg-black">
                          <img src={inf.image} className="w-full h-full object-cover opacity-95" />
                          <div className="absolute top-3 sm:top-4 left-3 sm:left-4 text-white">
                            <span className="font-handwritten text-xl sm:text-2xl text-[#fffeea] block font-bold leading-tight">{inf.tag}</span>
                            <span className="text-[9px] sm:text-[10px] font-bold uppercase">{inf.sub}</span>
                          </div>
                          <span className="absolute top-3 right-3 bg-black/60 text-white text-[9px] px-1.5 py-0.5 rounded-md">👁️ {inf.views}</span>
                        </div>

                        <div className="p-2.5 sm:p-3 space-y-2">
                          <div className="flex items-center gap-2">
                            <img src={inf.product.images[0]} className="w-8 h-8 sm:w-9 sm:h-9 object-cover rounded-lg border shrink-0" />
                            <div className="min-w-0 flex-1">
                              <p className="text-[11px] sm:text-xs font-bold truncate">{inf.product.name}</p>
                              <p className="text-xs font-black">₹{inf.product.price}</p>
                            </div>
                          </div>
                          <button onClick={() => { addToCart(inf.product); setIsCartOpen(true); }} className="w-full py-2 bg-[#FBB6CE] hover:bg-[#F89CBA] text-[#1A1821] text-[11px] sm:text-xs font-black uppercase tracking-wider rounded-lg">
                            Add to Cart
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* SHOP PAGE */}
            {page === 'shop' && (
              <div className="max-w-7xl mx-auto px-4 sm:px-6 space-y-6">
                <div className="flex items-center justify-between pb-4 border-b border-[#EAE6DB]">
                  <h2 className="font-sans font-black text-xl sm:text-2xl uppercase">Shop {category === 'nightwear' ? 'Nightwear' : category === 'jewellery' ? '18K Jewels' : 'All'}</h2>
                  <div className="flex gap-1.5 sm:gap-2">
                    <button onClick={() => setCategory('all')} className={`px-3 py-1.5 text-xs font-bold uppercase ${category === 'all' ? 'bg-[#967BB6] text-white' : 'bg-white border'}`}>All</button>
                    <button onClick={() => setCategory('nightwear')} className={`px-3 py-1.5 text-xs font-bold uppercase ${category === 'nightwear' ? 'bg-[#967BB6] text-white' : 'bg-white border'}`}>Nightwear</button>
                    <button onClick={() => setCategory('jewellery')} className={`px-3 py-1.5 text-xs font-bold uppercase ${category === 'jewellery' ? 'bg-[#967BB6] text-white' : 'bg-white border'}`}>Jewellery</button>
                  </div>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-4 gap-3.5 sm:gap-6">
                  {PRODUCTS.filter(p => category === 'all' || p.category === category).map(p => (
                    <div key={p.id} onClick={() => { setSelectedProduct(p); setPage('product'); }} className="group cursor-pointer flex flex-col justify-between">
                      <div className="aspect-[3/4] sm:aspect-[4/5] bg-white border border-[#EAE6DB] relative overflow-hidden mb-2">
                        <img src={p.images[0]} className="w-full h-full object-cover group-hover:scale-105 transition-all duration-300" />
                        {p.isNewArrival && <span className="absolute top-2 left-2 bg-[#967BB6] text-white text-[9px] font-bold px-2 py-0.5 uppercase">New Arrival</span>}
                        <span className="absolute bottom-2 left-2 bg-white/90 text-[9px] font-bold px-2 py-0.5 border">
                          {p.category === 'jewellery' ? '18K Gold ✨' : '100% Cotton 🌿'}
                        </span>
                      </div>
                      <div>
                        <h4 className="font-sans font-bold text-xs sm:text-sm truncate group-hover:text-[#967BB6]">{p.name}</h4>
                        <p className="font-black text-xs sm:text-sm">Rs. {p.price}.00</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* PRODUCT DETAILS PAGE */}
            {page === 'product' && selectedProduct && (
              <div className="max-w-7xl mx-auto px-4 sm:px-6 space-y-6">
                <button onClick={() => setPage('shop')} className="text-xs font-bold text-brand-muted hover:text-[#967BB6]">
                  ← Back to Collection
                </button>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8 items-start">
                  <div className="aspect-[3/4] sm:aspect-[4/5] bg-white border border-[#EAE6DB] overflow-hidden">
                    <img src={selectedProduct.images[0]} className="w-full h-full object-cover" />
                  </div>
                  <div className="bg-white p-5 sm:p-8 border border-[#EAE6DB] space-y-4">
                    <span className="text-[10px] font-bold uppercase tracking-widest text-[#967BB6]">{selectedProduct.subCategory}</span>
                    <h1 className="font-sans font-black text-xl sm:text-3xl uppercase leading-tight">{selectedProduct.name}</h1>
                    <div className="flex items-baseline gap-3">
                      <span className="text-xl sm:text-2xl font-black">Rs. {selectedProduct.price}.00</span>
                      <span className="text-xs sm:text-sm text-brand-muted line-through">Rs. {selectedProduct.originalPrice}.00</span>
                    </div>
                    <p className="text-xs text-brand-muted leading-relaxed">{selectedProduct.description}</p>
                    {selectedProduct.sizes && (
                      <div className="space-y-2">
                        <span className="text-xs font-bold uppercase">Size:</span>
                        <div className="flex gap-2">
                          {selectedProduct.sizes.map(s => (
                            <button key={s} className="w-10 h-10 border text-xs font-bold hover:border-[#967BB6] focus:bg-[#967BB6] focus:text-white">
                              {s}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}
                    <div className="space-y-2 pt-2">
                      <button onClick={() => { addToCart(selectedProduct); setIsCartOpen(true); }} className="w-full py-3 bg-[#967BB6] hover:bg-[#7F62A1] text-white text-xs font-black uppercase tracking-wider">
                        Add to Cart
                      </button>
                      <button onClick={() => { addToCart(selectedProduct); setIsCheckoutOpen(true); }} className="w-full py-3 bg-[#FBB6CE] hover:bg-[#F89CBA] text-[#1A1821] text-xs font-black uppercase tracking-wider">
                        Buy It Now (Express Checkout)
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Cart Drawer */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 flex justify-end modal-backdrop" onClick={() => setIsCartOpen(false)}>
              <div className="w-full max-w-md bg-white h-full p-5 sm:p-6 flex flex-col justify-between" onClick={e => e.stopPropagation()}>
                <div className="space-y-4">
                  <div className="flex justify-between items-center border-b pb-3">
                    <h3 className="font-sans font-black text-base uppercase">Your Bag ({cart.reduce((s, i) => s + i.qty, 0)})</h3>
                    <button onClick={() => setIsCartOpen(false)} className="text-lg font-bold">✕</button>
                  </div>
                  {subtotal < 999 && subtotal > 0 && (
                    <div className="p-2.5 bg-[#fffeea] border text-xs font-bold">
                      Add <strong>₹{999 - subtotal}</strong> more for <strong>FREE Delivery!</strong>
                    </div>
                  )}
                  <div className="space-y-3 max-h-96 overflow-y-auto">
                    {cart.map(i => (
                      <div key={i.key} className="flex gap-3 border-b pb-3">
                        <img src={i.product.images[0]} className="w-14 h-18 object-cover border" />
                        <div className="flex-1">
                          <h5 className="text-xs font-bold truncate">{i.product.name}</h5>
                          <span className="text-[11px] text-brand-muted">Size: {i.size}</span>
                          <div className="flex justify-between items-center mt-2">
                            <div className="flex items-center gap-2 border px-2 py-0.5 text-xs font-bold">
                              <button onClick={() => updateQty(i.key, -1)}>-</button>
                              <span>{i.qty}</span>
                              <button onClick={() => updateQty(i.key, 1)}>+</button>
                            </div>
                            <span className="text-xs font-bold">Rs. {i.product.price * i.qty}.00</span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="space-y-3 border-t pt-4">
                  <div className="flex justify-between text-xs">
                    <span>Subtotal:</span>
                    <span className="font-bold">Rs. {subtotal}.00</span>
                  </div>
                  <div className="flex justify-between text-sm font-black border-t pt-2">
                    <span>Total:</span>
                    <span>Rs. {total}.00</span>
                  </div>
                  <button onClick={() => { setIsCartOpen(false); setIsCheckoutOpen(true); }} className="w-full bg-[#967BB6] hover:bg-[#7F62A1] text-white py-3.5 font-black text-xs uppercase tracking-wider">
                    Proceed to Checkout • Rs. {total}.00
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Mobile Sidebar Navigation */}
          {isMenuOpen && (
            <div className="fixed inset-0 z-50 flex modal-backdrop" onClick={() => setIsMenuOpen(false)}>
              <div className="w-4/5 max-w-xs bg-white h-full p-6 flex flex-col justify-between" onClick={e => e.stopPropagation()}>
                <div className="space-y-6">
                  <div className="flex justify-between items-center border-b pb-3">
                    <img src="/src/assets/logo-line.PNG" alt="Girly Tales" className="h-8 w-auto" onError={(e) => { e.target.src = '/src/assets/logo-line.png'; }} />
                    <button onClick={() => setIsMenuOpen(false)} className="text-lg font-bold">✕</button>
                  </div>
                  <div className="space-y-2 text-xs font-bold uppercase tracking-wider">
                    <button onClick={() => { navigate('home'); setIsMenuOpen(false); }} className="w-full text-left py-2.5 px-2 hover:bg-[#fffeea]">Home</button>
                    <button onClick={() => { navigate('shop', 'all'); setIsMenuOpen(false); }} className="w-full text-left py-2.5 px-2 hover:bg-[#fffeea]">Shop All</button>
                    <button onClick={() => { navigate('shop', 'nightwear'); setIsMenuOpen(false); }} className="w-full text-left py-2.5 px-2 hover:bg-[#fffeea] text-[#967BB6]">Nightwear &amp; Pyjamas</button>
                    <button onClick={() => { navigate('shop', 'jewellery'); setIsMenuOpen(false); }} className="w-full text-left py-2.5 px-2 hover:bg-[#fffeea] text-amber-700">18K Anti-Tarnish Jewels</button>
                  </div>
                </div>
                <div className="p-3 bg-[#fffeea] border text-center text-xs">
                  <p className="font-bold">✦ BUNDLE DEAL ✦</p>
                  <p className="text-[11px] text-brand-muted">Buy Any 3 for ₹2999</p>
                </div>
              </div>
            </div>
          )}

          {/* Search Popup */}
          {isSearchOpen && (
            <div className="fixed inset-0 z-50 flex items-start justify-center pt-20 p-4 modal-backdrop" onClick={() => setIsSearchOpen(false)}>
              <div className="bg-white max-w-lg w-full p-5 space-y-4" onClick={e => e.stopPropagation()}>
                <input
                  type="text"
                  placeholder="Search pyjamas, rings, necklaces..."
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  className="w-full p-3 border-b text-sm font-bold outline-none uppercase"
                  autoFocus
                />
                <div className="max-h-60 overflow-y-auto space-y-2">
                  {PRODUCTS.filter(p => !searchQuery || p.name.toLowerCase().includes(searchQuery.toLowerCase())).map(p => (
                    <div key={p.id} onClick={() => { setSelectedProduct(p); setPage('product'); setIsSearchOpen(false); }} className="flex items-center gap-3 p-2 hover:bg-[#fffeea] cursor-pointer">
                      <img src={p.images[0]} className="w-10 h-12 object-cover" />
                      <div>
                        <p className="text-xs font-bold">{p.name}</p>
                        <p className="text-xs text-[#967BB6]">Rs. {p.price}.00</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Checkout Modal */}
          {isCheckoutOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop" onClick={() => setIsCheckoutOpen(false)}>
              <div className="bg-white max-w-md w-full p-6 space-y-4" onClick={e => e.stopPropagation()}>
                {orderDone ? (
                  <div className="text-center py-6 space-y-3">
                    <span className="text-4xl">🎉</span>
                    <h3 className="font-serif text-2xl font-bold">Order Confirmed!</h3>
                    <p className="text-xs text-brand-muted">Order #GT-{Math.floor(100000 + Math.random()*900000)} placed.</p>
                    <button onClick={() => { setIsCheckoutOpen(false); setOrderDone(false); setCart([]); }} className="bg-[#967BB6] text-white px-6 py-2 text-xs font-bold uppercase">Continue Shopping</button>
                  </div>
                ) : (
                  <div className="space-y-4">
                    <h3 className="font-sans font-black text-xl uppercase">Delivery Details</h3>
                    <input type="text" placeholder="Full Name" defaultValue="Ananya Verma" className="w-full border p-2 text-xs font-bold" />
                    <input type="text" placeholder="Address" defaultValue="Bandra West, Mumbai" className="w-full border p-2 text-xs font-bold" />
                    <div className="p-3 bg-[#fffeea] border text-xs font-bold flex justify-between">
                      <span>Total:</span>
                      <span>Rs. {total}.00</span>
                    </div>
                    <button onClick={() => setOrderDone(true)} className="w-full bg-[#967BB6] text-white py-3 font-black text-xs uppercase tracking-wider">
                      Place Order (COD / Prepaid)
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Toast Alert */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-white border border-[#967BB6] p-3 text-xs font-bold shadow-lg">
              <span>{toast.msg}</span> {toast.sub && <span className="text-brand-muted font-normal">({toast.sub})</span>}
            </div>
          )}

          {/* Footer */}
          <footer className="bg-[#1A1821] text-white py-12 px-6 border-t border-[#33303D] text-xs">
            <div className="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-8">
              <div className="space-y-2">
                <span className="font-serif font-black text-xl text-white uppercase">Girly Tales</span>
                <p className="text-white/60">Everyday soft luxury and 100% waterproof anti-tarnish jewels for modern women.</p>
              </div>
              <div>
                <h5 className="font-bold text-[#fffeea] uppercase mb-2">Shop</h5>
                <p className="text-white/60 cursor-pointer hover:underline" onClick={() => navigate('shop', 'nightwear')}>Night Suits</p>
                <p className="text-white/60 cursor-pointer hover:underline mt-1" onClick={() => navigate('shop', 'jewellery')}>Anti-Tarnish Jewellery</p>
              </div>
              <div>
                <h5 className="font-bold text-[#fffeea] uppercase mb-2">Help</h5>
                <p className="text-white/60">WhatsApp: +91 98765 43210</p>
                <p className="text-white/60 mt-1">care@girlytales.com</p>
              </div>
              <div>
                <h5 className="font-bold text-[#fffeea] uppercase mb-2">Instagram</h5>
                <p className="text-white/60">@girlytalesofficial</p>
              </div>
            </div>
            <div className="text-center text-white/40 pt-8 mt-8 border-t border-white/10">
              © 2026 Girly Tales India. All rights reserved.
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
